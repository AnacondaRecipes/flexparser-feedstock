{% set name = "flexparser" %}
{% set version = "0.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/flexparser-{{ version }}.tar.gz
  sha256: 266d98905595be2ccc5da964fe0a2c3526fbbffdc45b65b3146d75db992ef6b2

build:
  number: 1
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}

requirements:
  host:
    - python
    - pip
    - setuptools >=61
    - setuptools-scm
    - wheel
  run:
    - python
    - typing-extensions

test:
  requires:
    - pip
  imports:
    - flexparser
  commands:
    - pip check

about:
  home: https://github.com/hgrecco/flexparser
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Parsing made fun ... using typing.
  description: |
    flexparser is a Python parsing library that leverages type hints for intuitive and fun
    parsing of structured text formats. It provides a declarative approach to building parsers.
  dev_url: https://github.com/hgrecco/flexparser
  doc_url: https://github.com/hgrecco/flexparser/blob/main/README.md

extra:
  anaconda-services:
    ref:
      - https://anaconda.zendesk.com/agent/tickets/109074
  recipe-maintainers:
    - anaconda-services
