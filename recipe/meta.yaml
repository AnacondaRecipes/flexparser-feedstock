{% set name = "flexparser" %}
{% set version = "0.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/flexparser-{{ version }}.tar.gz
  sha256: 266d98905595be2ccc5da964fe0a2c3526fbbffdc45b65b3146d75db992ef6b2

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61
    - setuptools-scm >=3.4.3
    - wheel
  run:
    - python
    - typing_extensions

test:
  requires:
    - pip
  imports:
    - flexparser
  commands:
    - pip check

about:
  home: https://github.com/hgrecco/flexparser
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Parsing made fun using typing

extra:
  anaconda-services:
    ref:
      - https://anaconda.zendesk.com/agent/tickets/109074
  recipe-maintainers:
    - amaloney
